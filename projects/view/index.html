<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Experience | OFZ Group</title><meta name="description" content="Explore OFZ Group project experience across Sydney."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--ink:#17191a;--paper:#f4f3ef;--muted:#666b69}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Arial,sans-serif}a{color:inherit;text-decoration:none}header{background:#191c1d;color:#fff;padding:18px 7%;display:flex;justify-content:space-between;align-items:center;gap:15px}header img{width:135px;height:auto}header a:last-child{font-size:11px;letter-spacing:.1em}.wrap{padding:70px 7% 90px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}h1{font-size:clamp(43px,7vw,90px);font-weight:500;letter-spacing:-.055em;line-height:1.07;margin:22px 0}.lead{font-size:17px;line-height:1.8;color:var(--muted);max-width:850px}.cover{display:block;width:100%;max-height:650px;aspect-ratio:4/3;object-fit:cover;margin:40px 0}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:25px;margin-top:40px}.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.note{font-size:12px;color:var(--muted);margin-top:45px;line-height:1.8}footer{background:#191c1d;color:white;padding:30px 7%;font-size:12px}@media(max-width:700px){header{padding:15px 6%}header img{width:105px}header a:last-child{font-size:10px}.wrap{padding:55px 6% 65px}h1{font-size:clamp(39px,10vw,60px)}.lead{font-size:15px}.gallery{grid-template-columns:1fr;gap:22px}.cover{margin:28px 0}}</style></head><body><header><a href="../../"><img src="../../assets/ofz-logo-white.svg" alt="OFZ Group"></a><a id="back" href="../residential/">← PROJECT EXPERIENCE</a></header><main class="wrap"><div class="eyebrow">Project Experience / OFZ Group</div><h1 id="title">Project Experience.</h1><p id="summary" class="eyebrow"></p><p id="description" class="lead">Loading project...</p><img id="cover" class="cover" alt="" hidden><div id="gallery" class="gallery"></div><p class="note">Project experience include project undertaken by project management service</p></main><footer>OFZ GROUP · SYDNEY NSW</footer><script>(async function(){const slug=new URLSearchParams(location.search).get('slug');const desc=document.getElementById('description');if(!slug){desc.textContent='Project not found.';return}try{const r=await fetch('../../data/projects.json',{cache:'no-cache'});if(!r.ok)throw Error('Unable to load projects');const data=await r.json();const p=data.find(x=>x.slug===slug);if(!p){desc.textContent='Project not found.';return}document.title=p.title+' | Project Experience | OFZ Group';document.getElementById('title').textContent=p.title;document.getElementById('summary').textContent=p.summary||'';desc.textContent=p.description||'';const allowed=['residential','renovations','commercial','education'];document.getElementById('back').href='../'+(allowed.includes(p.category)?p.category:'residential')+'/';function src(v){if(typeof v!=='string'||!v)return null;if(/^https:\/\//i.test(v))return v;if(v.startsWith('/ofz-group-website/'))return v;if(v.startsWith('/'))return null;if(v.includes('..'))return null;return '../../'+v}const cover=src(p.cover);if(cover){const img=document.getElementById('cover');img.src=cover;img.alt=p.title+' project cover';img.hidden=false}const gallery=document.getElementById('gallery');for(const v of Array.isArray(p.gallery)?p.gallery:[]){const url=src(v);if(!url)continue;const img=document.createElement('img');img.src=url;img.alt=p.title+' project photo';img.loading='lazy';gallery.append(img)}}catch(e){desc.textContent='Project details are temporarily unavailable.'}})();</script></body></html>
