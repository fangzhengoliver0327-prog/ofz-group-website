<!doctype html><html lang="en"><head><meta name="description" content="Explore OFZ Group's home renovation and extension services in Sydney, including residential upgrades, additions and building project experience."><link rel="canonical" href="https://ofzconstructions.com.au/projects/renovations/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Renovations & Extensions Sydney | OFZ Group</title><style>:root{--ink:#17191a;--paper:#f4f3ef;--muted:#696d6c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Arial,Helvetica,sans-serif}a{color:inherit;text-decoration:none}header{background:#191c1d;color:#fff;padding:22px 7%;display:flex;align-items:center;justify-content:space-between;gap:20px}header img{width:135px}header a:last-child{font-size:11px;letter-spacing:.12em}.wrap{padding:90px 7% 110px;min-height:65vh}.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(52px,7vw,108px);line-height:1.02;letter-spacing:-.06em;font-weight:500;margin:20px 0 32px}.lead{font-size:18px;line-height:1.8;color:var(--muted);max-width:720px}.items{margin-top:65px;border-top:1px solid #c9cac6}.item{padding:30px 0;border-bottom:1px solid #c9cac6;display:flex;justify-content:space-between;gap:20px;align-items:center}.item strong{font-size:clamp(23px,3vw,38px);font-weight:500;letter-spacing:-.035em}.item span{font-size:13px;color:var(--muted)}.item:hover{opacity:.6}.empty{padding:30px 0;color:var(--muted)}.disclaimer{font-size:12px;color:var(--muted);margin-top:45px;line-height:1.8}footer{background:#191c1d;color:#fff;padding:35px 7%;font-size:12px}@media(max-width:650px){.item{align-items:flex-start;flex-direction:column}.wrap{padding-top:60px}}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></head><body><header><a href="../../"><img src="../../assets/ofz-logo-white.svg" alt="OFZ Group"></a><a href="../../#projects">← ALL PROJECT CATEGORIES</a></header><main class="wrap"><div class="eyebrow">Project Experience / Renovations & Extensions</div><h1>Renovations & Extensions.</h1><p class="lead">Renovation, extension and addition project experience.</p><div class="items"><div class="empty">Projects will be added here.</div></div><p class="disclaimer">Project experience include project undertaken by project management service</p></main><footer>OFZ GROUP · SYDNEY NSW</footer><script>(async function(){const list=document.querySelector('.items');if(!list)return;try{const res=await fetch('../../data/projects.json',{cache:'no-cache'});if(!res.ok)throw Error('Project data unavailable');const data=await res.json();const category=location.pathname.split('/').filter(Boolean).pop();const entries=data.filter(p=>p.category===category&&p.title);list.replaceChildren();if(!entries.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='Projects will be added here.';list.append(empty);return}for(const p of entries){const a=document.createElement('a');a.className='item';a.href=p.url?'../../'+p.url:'../view/?slug='+encodeURIComponent(p.slug);const name=document.createElement('strong');name.textContent=p.title+' ↗';const meta=document.createElement('span');meta.textContent=p.summary||'';a.append(name,meta);list.append(a)}}catch(e){console.warn('Using existing project links:',e)}})();</script></body></html>
