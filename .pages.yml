media:
  input: media/projects
  output: /media/projects
  rename: safe
content:
  - name: projects
    label: Project Experience
    type: file
    path: data/projects.json
    format: json
    list: true
    fields:
      - name: title
        label: Project name
        type: string
        required: true
      - name: slug
        label: URL slug (lowercase, hyphens)
        type: string
        required: true
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - name: residential
              label: Residential & Duplex
            - name: renovations
              label: Renovations & Extensions
            - name: commercial
              label: Commercial Fit-outs & Waterproofing
            - name: education
              label: Education & Childcare
      - name: summary
        label: Short label / location
        type: string
      - name: description
        label: Project description
        type: text
      - name: cover
        label: Cover image
        type: image
      - name: gallery
        label: Gallery images
        type: image
        list: true
      - name: url
        label: Existing project page (leave empty for new projects)
        type: string
